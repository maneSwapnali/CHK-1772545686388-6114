!DOCTYPE html>
<html>
<head>
<title>ShieldAI Login</title>
<style>
body{
font-family:Arial;
background:#0a0c10;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
color:white;
}

.box{
background:#111318;
padding:40px;
border-radius:10px;
width:300px;
}

input{
width:100%;
padding:10px;
margin:10px 0;
border:none;
border-radius:5px;
}

button{
width:100%;
padding:10px;
background:#00e5ff;
border:none;
border-radius:5px;
cursor:pointer;
}

a{
color:#00e5ff;
text-decoration:none;
}

.error{
color:red;
}
</style>
</head>

<body>

<div class="box">

<h2>ShieldAI Login</h2>

<form method="POST">

<input type="email" name="email" placeholder="Email" required>

<input type="password" name="password" placeholder="Password" required>

<button type="submit">Login</button>

</form>

<p>Don't have an account? <a href="/signup">Sign Up</a></p>

</div>

</body>
</html>
